name: release

# main への push で build が終わるたびに、build が通った main の最新のコミットから
# release/vX.Y.Z ブランチ・タグ vX.Y.Z・GitHub Release (ビルド添付) を作る。
# 版は前のタグの patch を 1 つ上げる。前のタグからこのコミットまでに入った PR に
# release:minor / release:major ラベルがあればそちらを上げる。タグが 1 つも無ければ v0.1.0 から始める。
on:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # build の成否は見ない。失敗した build の完了が待機中の実行を置き換えても、
    # この実行が「build が通った main の最新」を切るので取りこぼさない
    if: github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # 起動のきっかけのコミットではなく、build が通った main の最新のコミットを切る。
      # build は順不同に終わり、待機中の実行は置き換えられるので、
      # 最後に動いた実行が最新を切れば取りこぼしがない
      - name: Pick newest built commit on main
        run: |
          set -euo pipefail
          runs=$(gh run list --workflow build.yml --branch main --event push --status success \
            --limit 100 --json headSha,databaseId --jq '.[] | "\(.headSha) \(.databaseId)"')
          for c in $(git rev-list --first-parent --max-count 100 origin/main); do
            run=$(printf '%s\n' "$runs" | awk -v c="$c" '$1 == c { print $2; exit }')
            if [ -n "$run" ]; then
              echo "SHA=$c" >> "$GITHUB_ENV"
              echo "BUILD_RUN_ID=$run" >> "$GITHUB_ENV"
              echo "対象: $c (build run $run)"
              exit 0
            fi
          done
          echo "::notice::build が通った main のコミットが無いので切らない"
          echo "NO_TARGET=true" >> "$GITHUB_ENV"

      - name: Decide version
        id: ver
        run: |
          set -euo pipefail
          if [ "${NO_TARGET:-}" = true ]; then
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --tags --force
          semver='^v[0-9]+\.[0-9]+\.[0-9]+$'

          # 再実行: このコミットに版のタグがあれば、Release が欠けているときだけ作り直す
          tagged=$(git tag --points-at "$SHA" | grep -E "$semver" | head -n1 || true)
          if [ -n "$tagged" ]; then
            if gh release view "$tagged" >/dev/null 2>&1; then
              echo "mode=skip" >> "$GITHUB_OUTPUT"
              echo "$tagged は既にリリース済み"
            else
              echo "mode=release-only" >> "$GITHUB_OUTPUT"
              echo "version=$tagged" >> "$GITHUB_OUTPUT"
              echo "$tagged のタグはあるが Release が無いので作り直す"
            fi
            exit 0
          fi

          last=$(git tag --list 'v*' --sort=-v:refname | grep -E "$semver" | head -n1 || true)

          if [ -z "$last" ]; then
            next=v0.1.0
          else
            # 後のコミットが先にリリースされていたら、このコミットはそこに含まれるので切らない
            if git merge-base --is-ancestor "$SHA" "$last"; then
              echo "mode=skip" >> "$GITHUB_OUTPUT"
              echo "$SHA は $last に含まれる (後のコミットが先にリリース済み)"
              exit 0
            fi
            if ! git merge-base --is-ancestor "$last" "$SHA"; then
              echo "::error::$last が $SHA の祖先ではない。版を決められない"
              exit 1
            fi

            # 前のタグからこのコミットまでに入った PR のラベルをすべて見る
            # (待機中に置き換えられた実行の分もここで拾う)。取得の失敗は止める
            labels=""
            for c in $(git rev-list "$last..$SHA"); do
              l=$(gh api "repos/$GITHUB_REPOSITORY/commits/$c/pulls" --jq '[.[].labels[].name] | join(",")')
              labels="$labels,$l"
            done
            echo "前の版: $last / ラベル: ${labels:-なし}"

            IFS=. read -r major minor patch <<< "${last#v}"
            case "$labels," in
              *,release:major,*) major=$((major + 1)); minor=0; patch=0 ;;
              *,release:minor,*) minor=$((minor + 1)); patch=0 ;;
              *) patch=$((patch + 1)) ;;
            esac
            next="v$major.$minor.$patch"
          fi
          echo "mode=full" >> "$GITHUB_OUTPUT"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "次の版: $next"

      - name: Download build artifacts
        if: steps.ver.outputs.mode != 'skip'
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.BUILD_RUN_ID }}
          github-token: ${{ github.token }}
          path: dist
          merge-multiple: true

      - name: Create release branch and tag
        if: steps.ver.outputs.mode == 'full'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # ブランチとタグは両方できるか、どちらもできないか
          git push --atomic origin "$SHA:refs/heads/release/$VERSION" "$SHA:refs/tags/$VERSION"

      - name: Create GitHub Release
        if: steps.ver.outputs.mode != 'skip'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          ls -l dist
          gh release create "$VERSION" dist/*.zip --verify-tag --title "$VERSION" --generate-notes
